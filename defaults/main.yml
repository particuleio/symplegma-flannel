---
bin_dir: /opt/bin

flannel_backend: "host-gw"
flannel_vxlan_custom_config: true
flannel_vxlan_vni: 4096
flannel_vxlan_port: 4789
flannel_ipv4pool_cidr: "{{ kubeadm_pod_subnet | default('10.244.0.0/16') }}"
flannel_exec_dir: "{{ kubeadm_exec_dir | default('/root') }}"


# renovate: datasource=github-releases depName=flannel-io/flannel
flannel_version: v0.28.9
# renovate: datasource=github-releases depName=flannel-io/cni-plugin
flannel_cni_version: v1.9.1-flannel3
flannel_image: ghcr.io/flannel-io/flannel:{{ flannel_version }}
flannel_cni_image: ghcr.io/flannel-io/flannel-cni-plugin:{{ flannel_cni_version }}
