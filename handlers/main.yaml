---
- name: Flannel | Apply Flannel manifest
  ansible.builtin.shell: |
    {{ bin_dir }}/kubectl apply -f "{{ flannel_exec_dir }}"/kube-flannel.yaml
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"
  run_once: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  listen: "apply flannel manifest"
